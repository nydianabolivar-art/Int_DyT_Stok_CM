/* ==========================================================================
   Estilos — tema oscuro vibrante con acentos por carrera
   ========================================================================== */
:root {
  --bg: #050813; --bg2: #0a0f22; --card: rgba(16, 23, 47, .74); --card2: rgba(24, 33, 66, .7);
  --line: rgba(148, 163, 184, .18); --line2: rgba(148, 163, 184, .3);
  --tx: #eaf0ff; --mut: #9eabc9; --ok: #34d399; --bad: #fb7185; --warn: #fbbf24;
  --acc1: #22d3ee; --acc2: #f472b6; --acc3: #a3e635;
  --grad: linear-gradient(100deg, var(--acc1), var(--acc2));
  --r: 18px; --r2: 12px;
  --shadow: 0 18px 50px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
[data-career="bio"] { --acc1: #22d3ee; --acc2: #f472b6; --acc3: #a3e635; }
[data-career="mm"] { --acc1: #a78bfa; --acc2: #fb923c; --acc3: #facc15; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--tx); background: var(--bg);
  font: 400 16.5px/1.6 Sarabun, "Segoe UI", system-ui, -apple-system, sans-serif;
  background-image:
    radial-gradient(900px 520px at 8% -6%, color-mix(in srgb, var(--acc1) 26%, transparent), transparent 70%),
    radial-gradient(900px 600px at 105% 8%, color-mix(in srgb, var(--acc2) 22%, transparent), transparent 70%),
    radial-gradient(1200px 700px at 50% 120%, color-mix(in srgb, var(--acc3) 10%, transparent), transparent 70%);
  background-attachment: fixed;
}
#app { max-width: 1440px; margin: 0 auto; padding: 0 22px 30px; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; letter-spacing: -.01em; }
a { color: var(--acc1); }
code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .9em; background: rgba(148, 163, 184, .14); padding: 1px 6px; border-radius: 6px; }
.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.muted { color: var(--mut); }
.c { text-align: center; }
.ic { width: 1.15em; height: 1.15em; vertical-align: -.2em; flex: none; }
.lead { font-size: 1.08rem; color: #dbe4fb; }
.st1 { stop-color: var(--acc1); } .st2 { stop-color: var(--acc2); }

/* ---------- Encabezado ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0 16px; flex-wrap: wrap; }
.brand { display: flex; gap: 16px; align-items: center; }
.logo { width: 62px; height: 62px; flex: none; filter: drop-shadow(0 10px 24px color-mix(in srgb, var(--acc1) 45%, transparent)); }
.logo.big { width: 84px; height: 84px; margin: 0 auto 6px; }
.logo svg { width: 100%; height: 100%; }
.kick { font-weight: 800; font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--acc1); }
.brand h1 { font-size: clamp(1.35rem, 2.6vw, 2.05rem); font-weight: 800; }
.credit { margin-top: 4px; color: var(--mut); font-size: .92rem; display: flex; align-items: center; gap: 6px; }
.credit b { color: var(--tx); }
.credit.c { justify-content: center; margin-top: 14px; }
.top-r { display: flex; align-items: center; gap: 10px; }
.csw-l { color: var(--mut); font-size: .85rem; font-weight: 600; }
.csw { display: flex; background: rgba(15, 23, 42, .7); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
.csw-b { border: 0; background: transparent; color: var(--mut); font: 800 .82rem Sarabun, sans-serif; letter-spacing: .08em; padding: 9px 16px; border-radius: 999px; cursor: pointer; display: flex; gap: 7px; align-items: center; transition: .2s; }
.csw-b:hover { color: var(--tx); }
.csw-b.on { background: var(--grad); color: #0b1024; box-shadow: 0 8px 24px -6px color-mix(in srgb, var(--acc1) 60%, transparent); }

/* ---------- Pestañas ---------- */
.tabs { position: sticky; top: 0; z-index: 30; display: flex; gap: 6px; padding: 10px; margin: 0 -10px 18px; background: rgba(5, 8, 19, .78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 20px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: 1 0 auto; border: 0; background: transparent; color: var(--mut); font: 700 .98rem Sarabun, sans-serif; padding: 11px 16px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: .2s; white-space: nowrap; }
.tab:hover { color: var(--tx); background: rgba(148, 163, 184, .08); }
.tab.on { color: #fff; background: linear-gradient(100deg, color-mix(in srgb, var(--acc1) 34%, transparent), color-mix(in srgb, var(--acc2) 34%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc1) 50%, transparent), 0 8px 26px -10px var(--acc1); }
.pane { display: none; animation: fade .45s ease; }
.pane.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Componentes ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.card h3, .sec-t { display: flex; align-items: center; gap: 9px; font-size: 1.18rem; margin-bottom: 12px; }
.sec-t { margin: 26px 0 12px; }
.card h3 .ic, .sec-t .ic { color: var(--acc1); }
.btn { border: 1px solid var(--line2); background: rgba(30, 41, 79, .75); color: var(--tx); font: 700 .97rem Sarabun, sans-serif; padding: 11px 18px; border-radius: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s, box-shadow .2s, background .2s; text-decoration: none; }
.btn:hover:not(:disabled) { transform: translateY(-1px); border-color: color-mix(in srgb, var(--acc1) 60%, transparent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { padding: 8px 13px; font-size: .9rem; border-radius: 11px; }
.btn.big { padding: 14px 24px; font-size: 1.05rem; }
.btn.ghost { background: transparent; }
.btn-glow { border: 0; background: var(--grad); color: #0a0f22; box-shadow: 0 12px 30px -10px color-mix(in srgb, var(--acc1) 70%, transparent), 0 6px 22px -12px var(--acc2); }
.btn-glow:hover:not(:disabled) { box-shadow: 0 16px 40px -10px color-mix(in srgb, var(--acc1) 85%, transparent), 0 8px 30px -10px var(--acc2); }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--grad); color: #0a0f22; display: grid; place-items: center; cursor: pointer; flex: none; box-shadow: 0 8px 24px -8px var(--acc1); }
.icon-btn .ic { width: 20px; height: 20px; }
.chip { border: 1px solid var(--line2); background: rgba(15, 23, 42, .6); color: var(--mut); font: 700 .85rem Sarabun, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; transition: .2s; }
.chip.on { color: #fff; border-color: color-mix(in srgb, var(--acc1) 70%, transparent); background: color-mix(in srgb, var(--acc1) 20%, transparent); }
.chip.big { padding: 10px 16px; font-size: .95rem; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: .8rem; letter-spacing: .04em; padding: 5px 12px; border-radius: 999px; background: color-mix(in srgb, var(--acc1) 18%, transparent); color: color-mix(in srgb, var(--acc1) 80%, #fff); border: 1px solid color-mix(in srgb, var(--acc1) 45%, transparent); }
.pill.alt { background: color-mix(in srgb, var(--acc2) 16%, transparent); color: color-mix(in srgb, var(--acc2) 75%, #fff); border-color: color-mix(in srgb, var(--acc2) 45%, transparent); }
.inp { width: 100%; background: rgba(8, 12, 28, .75); border: 1px solid var(--line2); color: var(--tx); border-radius: 11px; padding: 10px 12px; font: 600 .98rem Sarabun, sans-serif; outline: none; transition: .2s; }
.inp:focus { border-color: var(--acc1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc1) 25%, transparent); }
.inp.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .95rem; }
.inp.sm { width: auto; padding: 7px 10px; font-size: .88rem; }
select.inp { cursor: pointer; }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: .86rem; color: var(--mut); font-weight: 600; }
.fld > span { display: flex; align-items: center; gap: 6px; min-height: 1.4em; }
.fgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.fld.full { grid-column: span 6; } .fld.half { grid-column: span 3; } .fld.third { grid-column: span 2; }
.bar { height: 8px; background: rgba(148, 163, 184, .16); border-radius: 99px; overflow: hidden; }
.bar.big { height: 12px; margin: 14px 0 6px; }
.bar-f { height: 100%; background: var(--grad); border-radius: 99px; transition: width .5s; box-shadow: 0 0 16px var(--acc1); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; margin-bottom: 16px; border: 1px solid; }
.banner .ic { width: 22px; height: 22px; margin-top: 2px; }
.banner.warn { background: rgba(251, 191, 36, .1); border-color: rgba(251, 191, 36, .4); color: #fde68a; }
.banner.info { background: color-mix(in srgb, var(--acc1) 10%, transparent); border-color: color-mix(in srgb, var(--acc1) 40%, transparent); }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px); background: #111a38; border: 1px solid var(--line2); color: var(--tx); padding: 12px 18px; border-radius: 14px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .3s; z-index: 80; font-weight: 600; max-width: 92vw; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Modal de carrera ---------- */
.modal-ov { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 18px; background: rgba(3, 6, 15, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: fade .4s; overflow-y: auto; }
.modal { width: min(880px, 100%); background: linear-gradient(160deg, #0f1733, #0a0f22); border: 1px solid var(--line2); border-radius: 26px; padding: 30px; text-align: center; box-shadow: 0 30px 80px -20px #000; }
.modal h2 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; margin: 6px 0 8px; }
.modal .fld { text-align: left; margin: 18px auto 6px; max-width: 520px; }
.ccards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
.ccard { position: relative; overflow: hidden; border-radius: 22px; padding: 24px 20px; cursor: pointer; text-align: left; color: var(--tx); border: 1px solid var(--line2); background: rgba(15, 23, 42, .7); transition: transform .2s, box-shadow .25s; font-family: Sarabun, sans-serif; }
.ccard::before { content: ""; position: absolute; inset: 0; opacity: .22; transition: .3s; }
.ccard.c-bio::before { background: radial-gradient(400px 220px at 0 0, #22d3ee, transparent 65%), radial-gradient(360px 220px at 100% 100%, #f472b6, transparent 65%); }
.ccard.c-mm::before { background: radial-gradient(400px 220px at 0 0, #a78bfa, transparent 65%), radial-gradient(360px 220px at 100% 100%, #fb923c, transparent 65%); }
.ccard:hover { transform: translateY(-4px); box-shadow: 0 20px 50px -18px rgba(0, 0, 0, .9); }
.ccard:hover::before { opacity: .4; }
.ccard > * { position: relative; }
.cc-ic { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: rgba(255, 255, 255, .1); }
.cc-ic .ic { width: 30px; height: 30px; }
.c-bio .cc-ic { color: #22d3ee; } .c-mm .cc-ic { color: #fb923c; }
.cc-n { font-size: 1.5rem; font-weight: 800; letter-spacing: .08em; margin: 14px 0 6px; }
.cc-d { color: #cbd5f5; font-size: .95rem; }
.cc-go { margin-top: 14px; font-weight: 800; display: flex; gap: 6px; align-items: center; }
.c-bio .cc-go { color: #22d3ee; } .c-mm .cc-go { color: #fb923c; }

/* ---------- Inicio ---------- */
.hero { position: relative; display: grid; grid-template-columns: 1.05fr 1fr; gap: 12px; align-items: center; border-radius: 28px; padding: 34px; background: linear-gradient(150deg, rgba(17, 25, 54, .88), rgba(9, 13, 30, .7)); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px; }
.hero h2 { font-size: clamp(1.7rem, 3.6vw, 2.9rem); font-weight: 800; margin: 14px 0 12px; }
.hero-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.hero-cv { width: 100%; height: 380px; display: block; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.olist { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.olist li { display: flex; gap: 12px; align-items: flex-start; }
.olist .ic { color: var(--acc2); width: 22px; height: 22px; margin-top: 2px; }
.rlist { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.rlist li::marker { color: var(--acc1); font-weight: 800; }
.route { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.rstep { position: relative; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--tx); border-radius: 18px; padding: 18px; cursor: pointer; transition: .2s; font-family: Sarabun, sans-serif; }
.rstep:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--acc1) 60%, transparent); }
.rs-n { position: absolute; top: 14px; right: 16px; font-weight: 800; font-size: 1.6rem; opacity: .25; }
.rs-ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--grad); color: #0a0f22; }
.rs-ic .ic { width: 24px; height: 24px; }
.rs-t { font-weight: 800; font-size: 1.08rem; margin-top: 12px; }
.rs-d { color: var(--mut); font-size: .9rem; }

/* ---------- Teoría ---------- */
.tgrid { display: grid; grid-template-columns: 290px 1fr; gap: 20px; align-items: start; }
.tnav { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.tprog { margin-bottom: 8px; }
.tprog-t { font-size: .84rem; color: var(--mut); font-weight: 700; margin-bottom: 6px; }
.tnav-i { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: var(--mut); text-align: left; padding: 9px 10px; border-radius: 11px; cursor: pointer; font: 600 .93rem Sarabun, sans-serif; transition: .2s; }
.tnav-i:hover { background: rgba(148, 163, 184, .08); color: var(--tx); }
.tnav-i.on { background: color-mix(in srgb, var(--acc1) 16%, transparent); color: #fff; }
.tn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 800; border: 1px solid var(--line2); flex: none; }
.tnav-i.seen .tn { background: var(--grad); color: #0a0f22; border: 0; }
.tnav-i.seen .tn .ic { width: 14px; height: 14px; }
.tbody { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 30px clamp(18px, 3vw, 38px); box-shadow: var(--shadow); min-width: 0; }
.tb-kick { color: var(--acc1); font-weight: 800; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; }
.tbody h2 { font-size: clamp(1.5rem, 2.8vw, 2.1rem); font-weight: 800; margin: 6px 0 14px; display: flex; gap: 10px; align-items: center; }
.tbody h2 .ic { color: var(--acc2); width: 30px; height: 30px; }
.tb-html p { margin: 10px 0; }
.tb-html ul, .tb-html ol { margin: 6px 0; padding-left: 22px; }
.tb-html li { margin: 4px 0; }
.tb-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.try { margin-top: 12px; }
.split { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 18px; align-items: center; margin: 8px 0; }
.tbox { border-radius: 16px; padding: 14px 18px; margin: 14px 0; border: 1px solid; position: relative; overflow: hidden; }
.tbox-h { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .86rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.tbox-h .ic { width: 20px; height: 20px; }
.tbox-b { color: #dde6fb; }
.tbox.idea { background: color-mix(in srgb, var(--acc1) 9%, transparent); border-color: color-mix(in srgb, var(--acc1) 38%, transparent); }
.tbox.idea .tbox-h { color: var(--acc1); }
.tbox.formula { background: color-mix(in srgb, var(--acc3) 7%, transparent); border-color: color-mix(in srgb, var(--acc3) 35%, transparent); }
.tbox.formula .tbox-h { color: var(--acc3); }
.tbox.example { background: color-mix(in srgb, var(--acc2) 8%, transparent); border-color: color-mix(in srgb, var(--acc2) 36%, transparent); }
.tbox.example .tbox-h { color: var(--acc2); }
.tbox.warn { background: rgba(251, 113, 133, .08); border-color: rgba(251, 113, 133, .38); }
.tbox.warn .tbox-h { color: #fb7185; }
.tbox.recipe { background: rgba(129, 140, 248, .09); border-color: rgba(129, 140, 248, .38); }
.tbox.recipe .tbox-h { color: #a5b4fc; }
.tbox.career { background: linear-gradient(120deg, color-mix(in srgb, var(--acc1) 14%, transparent), color-mix(in srgb, var(--acc2) 14%, transparent)); border-color: color-mix(in srgb, var(--acc2) 45%, transparent); }
.tbox.career .tbox-h { color: #fff; }
.mblock { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
math { font-size: 1.08em; }
math.tml-display, math[display="block"] { margin: 8px 0; }
.dg { width: 100%; height: auto; display: block; }
.dg .ax { stroke: var(--mut); stroke-width: 1.4; }
.dg .cell { fill: color-mix(in srgb, var(--acc1) 10%, transparent); stroke: color-mix(in srgb, var(--acc1) 55%, transparent); stroke-width: 1; }
.dg .cell.hl { fill: color-mix(in srgb, var(--acc1) 22%, transparent); }
.dg .cell.pick, .dg .reg.pick { fill: color-mix(in srgb, var(--acc2) 45%, transparent); stroke: var(--acc2); stroke-width: 2; }
.dg .pt { fill: #fff; }
.dg .reg { fill: color-mix(in srgb, var(--acc1) 18%, transparent); stroke: none; }
.dg .cv1 { fill: none; stroke: var(--acc1); stroke-width: 2.6; }
.dg .cv1.thick { stroke-width: 3.4; }
.dg .cv2 { fill: none; stroke: var(--acc2); stroke-width: 2.6; }
.dg .dash { stroke: var(--mut); stroke-dasharray: 4 4; stroke-width: 1.2; fill: none; }
.dg .strip { fill: color-mix(in srgb, var(--acc2) 55%, transparent); stroke: var(--acc2); }
.dg .swirl { fill: none; stroke: color-mix(in srgb, var(--acc2) 85%, #fff); stroke-width: 1.6; }
.dg .swirlh { fill: color-mix(in srgb, var(--acc2) 85%, #fff); }
.dg .arrowh { fill: var(--acc1); } .dg .arrowh2 { fill: var(--acc2); }
.dg .src { fill: var(--acc3); filter: drop-shadow(0 0 6px var(--acc3)); }
.dg .lb { fill: #e2e8f0; font: 600 14px Sarabun, sans-serif; }
.dg .lb.sm { font-size: 12px; } .dg .lb.it { font-style: italic; font-family: "STIX Two Math", serif; font-size: 16px; }
.tsyn { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 14px 0; }
.syn { border-radius: 16px; padding: 14px; background: var(--card2); border: 1px solid var(--line2); text-align: center; }
.syn-t { font-weight: 800; color: var(--acc1); letter-spacing: .04em; }
.syn-d { color: var(--mut); font-size: .9rem; font-weight: 600; }

/* ---------- Práctica y aplicados ---------- */
.pane-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.pane-head h2 { font-size: 1.7rem; font-weight: 800; display: flex; gap: 10px; align-items: center; }
.pane-head h2 .ic { color: var(--acc2); }
.score { background: var(--card); border: 1px solid var(--line); padding: 10px 16px; border-radius: 14px; display: flex; gap: 8px; align-items: center; }
.score .ic { color: var(--ok); }
.excard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex-top { display: flex; gap: 8px; flex-wrap: wrap; }
.ctx { color: #d3dcf3; margin: 0; }
.stem { font-size: 1.1rem; font-weight: 600; margin: 2px 0; }
.ans-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ans-row .inp { flex: 1 1 200px; width: auto; }
.unit { color: var(--mut); font-weight: 700; }
.fb { display: none; padding: 10px 14px; border-radius: 12px; gap: 8px; align-items: flex-start; }
.fb.good, .fb.bad { display: flex; }
.fb.good { background: rgba(52, 211, 153, .12); border: 1px solid rgba(52, 211, 153, .45); color: #a7f3d0; }
.fb.bad { background: rgba(251, 113, 133, .1); border: 1px solid rgba(251, 113, 133, .4); color: #fecdd3; }
.fb .ic { margin-top: 3px; }
.ex-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sol { display: none; margin-top: 6px; }
.sol.open { display: block; animation: fade .4s; }
.agrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

/* ---------- Simulador ---------- */
.sim-modes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.sim-mode { flex: 1 1 160px; border: 1px solid var(--line); background: var(--card); color: var(--mut); border-radius: 16px; padding: 13px; cursor: pointer; font: 800 .98rem Sarabun, sans-serif; display: flex; gap: 9px; align-items: center; justify-content: center; transition: .2s; }
.sim-mode:hover { color: var(--tx); }
.sim-mode.on { color: #0a0f22; background: var(--grad); border-color: transparent; box-shadow: 0 10px 30px -10px var(--acc1); }
.sim-grid { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 16px; align-items: start; }
.sim-panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.lbl { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: .84rem; letter-spacing: .06em; text-transform: uppercase; color: var(--acc1); margin-top: 4px; }
.hint { margin: -2px 0 2px; font-size: .84rem; color: var(--mut); }
.sim-msg { display: none; background: rgba(251, 113, 133, .12); border: 1px solid rgba(251, 113, 133, .45); color: #fecdd3; padding: 10px 12px; border-radius: 12px; font-size: .92rem; font-weight: 600; }
.sim-msg.show { display: block; }
.sim-results { display: flex; flex-direction: column; gap: 8px; }
.rhead { display: flex; }
.badge { font-size: .74rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; }
.badge.ok { background: rgba(52, 211, 153, .16); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, .4); }
.badge.num { background: rgba(251, 191, 36, .14); color: #fcd34d; border: 1px solid rgba(251, 191, 36, .4); }
.rcard { border-radius: 14px; padding: 10px 12px; background: rgba(8, 12, 28, .6); border: 1px solid var(--line); }
.rcard.main { border-color: color-mix(in srgb, var(--acc1) 55%, transparent); box-shadow: inset 0 0 24px -12px var(--acc1); }
.rcard.main2 { border-color: color-mix(in srgb, var(--acc2) 55%, transparent); box-shadow: inset 0 0 24px -12px var(--acc2); }
.rt { font-size: .84rem; color: var(--mut); font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rb { font-size: 1.18rem; font-weight: 700; overflow-x: auto; }
.pt-out { display: flex; flex-direction: column; gap: 6px; }
.pt-head { display: flex; gap: 7px; align-items: center; font-weight: 800; font-size: .84rem; letter-spacing: .06em; text-transform: uppercase; color: var(--acc2); }
.pt-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: rgba(8, 12, 28, .5); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; overflow-x: auto; }
.pt-row span { font-weight: 700; }
.pt-note, .pt-warn, .pt-bad { font-size: .88rem; color: #dbe4fb; display: flex; gap: 6px; align-items: flex-start; }
.pt-warn, .pt-bad { color: #fcd34d; }
.sim-stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage-main, .stage-sub { position: relative; background: radial-gradient(800px 400px at 50% 0%, rgba(30, 41, 79, .65), rgba(6, 9, 20, .92)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.stage-main { height: 520px; }
.stage-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stage-sub { height: 310px; }
.cv { width: 100%; height: 100%; display: block; cursor: grab; }
.cv:active { cursor: grabbing; }
.stage-tag { position: absolute; left: 12px; top: 10px; right: 12px; pointer-events: none; font-weight: 700; font-size: .9rem; color: #f1f5ff; text-shadow: 0 2px 10px #000; }
.stage-hint { position: absolute; left: 12px; bottom: 10px; color: var(--mut); font-size: .8rem; display: flex; gap: 6px; align-items: center; pointer-events: none; }
.cbar { position: absolute; right: 14px; bottom: 12px; width: 200px; pointer-events: none; }
.cb-l { font-size: .78rem; font-weight: 700; color: #e2e8f0; text-align: right; margin-bottom: 3px; }
.cb-bar { height: 10px; border-radius: 6px; box-shadow: 0 0 12px rgba(0, 0, 0, .5); }
.cb-t { display: flex; justify-content: space-between; font-size: .76rem; color: var(--mut); font-weight: 600; margin-top: 2px; }
.anim-bar { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; flex-wrap: wrap; }
.scrub-wrap { flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px; min-width: 200px; }
.anim-label { font-size: .9rem; min-height: 1.5em; overflow-x: auto; white-space: nowrap; }
.range { width: 100%; accent-color: var(--acc1); }
.range.sm { width: 120px; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rng-wrap { display: flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 700; color: var(--mut); background: rgba(15, 23, 42, .6); border: 1px solid var(--line2); border-radius: 999px; padding: 4px 12px; }
.rng-wrap > span:first-child { display: flex; gap: 5px; align-items: center; }
.rng-lab { color: var(--tx); min-width: 52px; }
.steps-panel { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.steps-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.steps-head h3 { display: flex; gap: 9px; align-items: center; font-size: 1.2rem; }
.steps-head h3 .ic { color: var(--acc2); }
.step-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.step-count { color: var(--mut); font-weight: 700; font-size: .9rem; margin-right: 4px; }
.steps-list { display: flex; flex-direction: column; gap: 10px; }
.step { display: none; gap: 14px; padding: 14px; border-radius: 14px; background: rgba(8, 12, 28, .55); border: 1px solid var(--line); min-width: 0; }
.step.show { display: flex; animation: fade .45s; }
.step.sub { margin-left: 28px; border-style: dashed; }
.step.final { border-color: color-mix(in srgb, var(--acc3) 55%, transparent); background: color-mix(in srgb, var(--acc3) 7%, rgba(8, 12, 28, .55)); }
.step-n { width: 32px; height: 32px; border-radius: 50%; background: var(--grad); color: #0a0f22; font-weight: 800; display: grid; place-items: center; flex: none; }
.step-b { min-width: 0; flex: 1; }
.step-b h4 { font-size: 1.02rem; margin-bottom: 4px; }
.step-b p { margin: 4px 0; color: #d3dcf3; font-size: .96rem; }
.step-m { overflow-x: auto; }
.mline { overflow-x: auto; overflow-y: hidden; }

/* ---------- Evaluación ---------- */
.eintro { max-width: 860px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.eintro h2 { font-size: 2rem; font-weight: 800; }
.ei-badge { width: 84px; height: 84px; border-radius: 26px; display: grid; place-items: center; background: var(--grad); color: #0a0f22; box-shadow: 0 16px 40px -12px var(--acc1); }
.ei-badge .ic { width: 44px; height: 44px; }
.erules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; text-align: left; }
.er { display: flex; gap: 10px; background: rgba(8, 12, 28, .55); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: .94rem; }
.er .ic { color: var(--acc1); width: 22px; height: 22px; margin-top: 2px; }
.eintro .fld { width: 100%; max-width: 520px; text-align: left; }
.lock { max-width: 760px; margin: 0 auto; text-align: center; }
.lock-ic { width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 22px; display: grid; place-items: center; background: rgba(251, 191, 36, .14); color: var(--warn); border: 1px solid rgba(251, 191, 36, .45); }
.lock-ic .ic { width: 38px; height: 38px; }
.lock h2 { margin-bottom: 8px; }
.qwrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; }
.qdots { display: flex; gap: 6px; flex-wrap: wrap; }
.qd { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line2); background: rgba(15, 23, 42, .7); color: var(--mut); font-weight: 800; cursor: pointer; font-family: Sarabun, sans-serif; }
.qd.done { background: color-mix(in srgb, var(--acc1) 26%, transparent); color: #fff; border-color: color-mix(in srgb, var(--acc1) 60%, transparent); }
.qd.on { background: var(--grad); color: #0a0f22; border: 0; box-shadow: 0 6px 18px -6px var(--acc1); }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: var(--shadow); }
.qn { color: var(--acc1); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; }
.qstem { font-size: 1.12rem; margin: 8px 0 16px; }
.qstem.sm { font-size: 1rem; margin: 6px 0; }
.qopts { display: grid; gap: 10px; }
.qopt { display: flex; gap: 14px; align-items: center; text-align: left; border: 1px solid var(--line2); background: rgba(8, 12, 28, .6); color: var(--tx); border-radius: 16px; padding: 14px 16px; cursor: pointer; transition: .18s; font: 600 1rem Sarabun, sans-serif; min-width: 0; }
.qopt:hover { border-color: color-mix(in srgb, var(--acc1) 60%, transparent); transform: translateX(2px); }
.qopt.on { border-color: var(--acc1); background: color-mix(in srgb, var(--acc1) 16%, rgba(8, 12, 28, .6)); box-shadow: 0 0 0 1px var(--acc1), 0 10px 26px -12px var(--acc1); }
.ql { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(148, 163, 184, .16); font-weight: 800; flex: none; }
.qopt.on .ql { background: var(--grad); color: #0a0f22; }
.qt { min-width: 0; overflow-x: auto; }
.qnav { display: flex; justify-content: space-between; gap: 10px; }
.res { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: center; max-width: 920px; margin: 0 auto; }
.res h2 { font-size: 1.9rem; font-weight: 800; margin-bottom: 6px; }
.res .lead { margin-bottom: 16px; }
.ring { width: 200px; height: 200px; }
.ring-bg { fill: none; stroke: rgba(148, 163, 184, .18); stroke-width: 12; }
.ring-fg { fill: none; stroke-width: 12; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 60px 60px; animation: ring 1.2s ease; }
.ring-fg.ok { stroke: var(--ok); filter: drop-shadow(0 0 8px var(--ok)); }
.ring-fg.no { stroke: var(--bad); filter: drop-shadow(0 0 8px var(--bad)); }
@keyframes ring { from { stroke-dasharray: 0 314.16; } }
.ring-t { fill: #fff; font: 800 26px Sarabun, sans-serif; text-anchor: middle; }
.ring-s { fill: var(--mut); font: 700 14px Sarabun, sans-serif; text-anchor: middle; }
.rev { max-width: 920px; margin: 0 auto 12px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid; border-radius: 16px; padding: 14px 18px; }
.rev.good { border-left-color: var(--ok); } .rev.bad { border-left-color: var(--bad); }
.rev-h { display: flex; gap: 8px; align-items: center; font-weight: 700; color: #dbe4fb; }
.rev.good .rev-h .ic { color: var(--ok); } .rev.bad .rev-h .ic { color: var(--bad); }
.rev-a { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; overflow-x: auto; }
.rev-e { display: flex; gap: 10px; background: rgba(8, 12, 28, .5); border-radius: 12px; padding: 10px 12px; color: #d3dcf3; font-size: .95rem; }
.rev-e .ic { color: var(--acc3); width: 20px; height: 20px; margin-top: 2px; }
.certw { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
.cert-head h2 { font-size: 1.9rem; font-weight: 800; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.cert-img { width: 100%; border-radius: 16px; box-shadow: 0 24px 60px -20px #000, 0 0 0 1px var(--line2); }
.cert-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 34px; padding: 18px 4px 0; border-top: 1px solid var(--line); color: var(--mut); font-size: .92rem; }
.foot span { display: flex; gap: 7px; align-items: center; }
.foot b { color: var(--tx); }

/* ---------- Responsivo ---------- */
@media (max-width: 1100px) {
  .sim-grid { grid-template-columns: 1fr; }
  .route { grid-template-columns: repeat(3, 1fr); }
  .tgrid { grid-template-columns: 1fr; }
  .tnav { position: static; display: grid; grid-template-columns: repeat(2, 1fr); }
  .tprog { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  #app { padding: 0 14px 24px; }
  body { font-size: 15.5px; }
  .hero { grid-template-columns: 1fr; padding: 22px; }
  .hero-cv { height: 260px; }
  .grid2, .agrid, .ccards, .erules, .stage-row, .tsyn { grid-template-columns: 1fr; }
  .route { grid-template-columns: 1fr 1fr; }
  .split { grid-template-columns: 1fr; }
  .stage-main { height: 380px; } .stage-sub { height: 270px; }
  .tnav { grid-template-columns: 1fr; }
  .res { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .tab span { display: none; }
  .tab { padding: 11px 13px; }
  .top-r { width: 100%; justify-content: space-between; }
  .step.sub { margin-left: 10px; }
  .cbar { width: 140px; }
  .stage-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.stale { position: absolute; inset: auto 12px 44px 12px; display: none; gap: 8px; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 12px; background: rgba(251, 191, 36, .14); border: 1px solid rgba(251, 191, 36, .45); color: #fde68a; font-weight: 700; font-size: .9rem; backdrop-filter: blur(6px); }
.stale.show { display: flex; }

function syncPlay() { els.play.innerHTML = icon(S.anim.playing ? 'pause' : 'play'); }
function presetList() {

function fillPresets() {

function setMode(m, silent) {

  fillPresets();
  const p = presetList()[0];
  loadValues(p.v);
  buildToggles();
  run();
}

/* ======================== GEOMETRÍA: DOBLE ======================== */
function prepDbl(o) {

    if (reg.r1 > 0) for (let k = 80; k >= 0; k--) { const t = reg.thMax * k / 80; bnd.push([reg.r1 * Math.cos(t), reg.r1 * Math.sin(t)]); }

    for (let k = 60; k >= 0; k--) { const x = reg.a + (reg.b - reg.a) * k / 60; bnd.push([x, reg.g2(x)]); }

function drawDbl(sAnim) {

        box('formula', 'Coordenadas cilíndricas', '$$x = r\\cos\\theta,\\quad y = r\\sen\\theta,\\quad z = z,\\qquad dV = r\\,dz\\,dr\\,d\\theta$$Úsalas con cilindros, conos y paraboloides con eje vertical.') +
        '<div class="split">' + SVG.spherical + '<div>' +
        box('formula', 'Coordenadas esféricas', '$$x = \\rho\\sen\\varphi\\cos\\theta,\\quad y = \\rho\\sen\\varphi\\sen\\theta,\\quad z = \\rho\\cos\\varphi$$$$dV = \\rho^2\\sen\\varphi\\,d\\rho\\,d\\varphi\\,d\\theta,\\qquad 0 \\le \\varphi \\le \\pi,\\; 0 \\le \\theta \\le 2\\pi$$$\\rho$ es la distancia al origen y $\\varphi$ el ángulo medido desde el eje $z$ positivo.') +
        '</div></div>' +
        box('example', 'Ejemplo resuelto: volumen de una esfera', '$$\\int_0^{2\\pi}\\!\\!\\int_0^{\\pi}\\!\\!\\int_0^{a} \\rho^2\\sen\\varphi\\,d\\rho\\,d\\varphi\\,d\\theta = \\frac{a^3}{3}\\cdot 2\\cdot 2\\pi = \\frac{4}{3}\\pi a^3$$') +
        box('warn', 'Errores frecuentes', '<ul><li>Omitir $\\rho^2$ o $\\sen\\varphi$ del jacobiano.</li><li>Tomar $\\varphi$ entre $0$ y $2\\pi$: el ángulo polar solo llega hasta $\\pi$ (con $2\\pi$ la integral de $\\sen\\varphi$ da cero).</li></ul>') +
        C('Vasos sanguíneos y huesos largos se modelan con <b>cilíndricas</b>; tumores, células y el globo ocular, con <b>esféricas</b>.',
          'Ruedas, columnas y cápsulas de colisión se integran en <b>cilíndricas</b>; planetas, partículas y explosiones, en <b>esféricas</b>.')
    },
    {
      id: 't6', title: 'Campos, rotacional y divergencia', icon: 'field', sim: ['grn', bio ? 'Vórtice en un vaso sanguíneo' : 'Viento sobre un lienzo'],
      html:
        '<p class="lead">Los tres teoremas que siguen hablan de <b>campos vectoriales</b> $\\mathbf{F} = \\langle P, Q, R\\rangle$: a cada punto se le asigna un vector (velocidad, fuerza, flujo).</p>' +
        box('formula', 'Integral de línea (circulación o trabajo)', 'Si $C$ se parametriza con $\\mathbf{r}(t)$, $a \\le t \\le b$:$$\\int_C \\mathbf{F}\\cdot d\\mathbf{r} = \\int_a^b \\mathbf{F}(\\mathbf{r}(t))\\cdot\\mathbf{r}\'(t)\\,dt$$Mide cuánto "empuja" el campo a lo largo de la curva.') +
        box('formula', 'Integral de superficie (flujo)', '$$\\iint_S \\mathbf{F}\\cdot d\\mathbf{S} = \\iint_S \\mathbf{F}\\cdot\\mathbf{n}\\,dS = \\iint_D \\mathbf{F}(\\mathbf{r}(u,v))\\cdot(\\mathbf{r}_u\\times\\mathbf{r}_v)\\,dA$$Mide cuánto campo <b>atraviesa</b> la superficie.') +
        box('formula', 'Rotacional y divergencia', '$$\\nabla\\times\\mathbf{F} = \\big\\langle R_y - Q_z,\\; P_z - R_x,\\; Q_x - P_y\\big\\rangle \\qquad \\nabla\\cdot\\mathbf{F} = P_x + Q_y + R_z$$<ul><li>El <b>rotacional</b> mide el giro local: una pequeña rueda de paletas colocada en el punto giraría alrededor de $\\nabla\\times\\mathbf{F}$.</li><li>La <b>divergencia</b> mide si el punto es fuente ($>0$), sumidero ($<0$) o ninguno ($=0$).</li></ul>') +
        box('example', 'Ejemplo', 'Para $\\mathbf{F} = \\langle -y,\\; x,\\; z\\rangle$:$$\\nabla\\times\\mathbf{F} = \\langle 0 - 0,\\; 0 - 0,\\; 1 - (-1)\\rangle = \\langle 0, 0, 2\\rangle,\\qquad \\nabla\\cdot\\mathbf{F} = 0 + 0 + 1 = 1$$El campo gira alrededor del eje $z$ y además "brota" hacia arriba.') +
        C('Velocidad de la sangre en un vaso, flujo de difusión de oxígeno (ley de Fick, $\\mathbf{J} = -D\\nabla c$), densidad de corriente en el tejido (EEG/ECG) y campos magnéticos en resonancia.',
          'Campos de viento, de velocidad de fluidos y de fuerzas en sistemas de partículas: el rotacional produce <b>remolinos</b> y la divergencia, <b>explosiones o implosiones</b>.')
    },
    {
      id: 't7', title: 'Teorema de Green', icon: 'route', sim: ['grn', bio ? 'Área de una lesión (contorno elíptico)' : 'Área de un trazado vectorial (triángulo)'],
      html:
        '<p class="lead">Green conecta la <b>circulación</b> alrededor de una curva cerrada plana con lo que ocurre <b>dentro</b> de la región que encierra.</p>' +
        box('formula', 'Enunciado', 'Sea $C$ una curva cerrada simple, suave por tramos, recorrida en sentido <b>antihorario</b> (la región $D$ queda a la izquierda). Si $P$ y $Q$ tienen derivadas parciales continuas en una región abierta que contiene a $D$:$$\\oint_C P\\,dx + Q\\,dy = \\iint_D \\left(\\frac{\\partial Q}{\\partial x} - \\frac{\\partial P}{\\partial y}\\right) dA$$') +
        '<div class="split">' + SVG.green + '<div>' +
        box('idea', '¿Por qué funciona?', 'Divide $D$ en celdas pequeñas. La circulación en cada celda es aproximadamente $(Q_x - P_y)\\,\\Delta A$. Al sumar todas, los lados <b>internos</b> se recorren dos veces en sentidos opuestos y se cancelan: solo sobrevive el borde exterior $C$.') +
        '</div></div>' +
        box('formula', 'Área con una integral de línea', 'Eligiendo $Q_x - P_y = 1$:$$\\text{Área}(D) = \\oint_C x\\,dy = -\\oint_C y\\,dx = \\frac12\\oint_C (x\\,dy - y\\,dx)$$') +
        box('example', 'Ejemplo resuelto', 'Con $\\mathbf{F} = \\langle -y,\\; x\\rangle$ sobre el rectángulo $[0,2]\\times[0,1]$: $Q_x - P_y = 1 - (-1) = 2$, así que $$\\oint_C -y\\,dx + x\\,dy = \\iint_D 2\\,dA = 2\\cdot 2 = 4$$Para la elipse $x = a\\cos t$, $y = b\\sen t$: $\\tfrac12\\oint (x\\,dy - y\\,dx) = \\tfrac12\\int_0^{2\\pi} ab\\,dt = \\pi ab$.') +
        box('warn', 'Errores frecuentes', '<ul><li>Recorrer $C$ en sentido horario: el resultado cambia de signo.</li><li>Restar al revés ($P_y - Q_x$).</li><li>Aplicarlo cuando el campo no es derivable en algún punto de $D$: por ejemplo, $\\mathbf{F} = \\frac{\\langle -y,\\, x\\rangle}{x^2+y^2}$ en un disco que contiene al origen.</li></ul>') +
        C('Los programas de segmentación calculan el <b>área de una lesión</b> a partir de su contorno con la fórmula de área de Green. La circulación mide los <b>remolinos</b> del flujo sanguíneo en la sección de un vaso o en un aneurisma.',
          'La <b>fórmula del cordón de zapato</b> (<i>shoelace</i>) que usan los programas vectoriales para el área de un polígono es Green en versión discreta; su <b>signo</b> indica si el trazado es horario o antihorario y decide cómo se rellena.')
    },

      id: 't8', title: 'Teorema de Stokes', icon: 'orbit', sim: ['stk', bio ? 'Microvórtice bajo una membrana' : 'Bandera al viento'],
      html:
        '<p class="lead">Stokes lleva la idea de Green al espacio: la circulación alrededor de la frontera de una superficie es igual al flujo del rotacional a través de ella.</p>' +
        '<div class="split">' + SVG.stokes + '<div>' +
        box('formula', 'Enunciado', 'Sea $S$ una superficie orientada, suave por tramos, cuya frontera es la curva cerrada simple $C$. Si $\\mathbf{F}$ tiene derivadas parciales continuas:$$\\oint_C \\mathbf{F}\\cdot d\\mathbf{r} = \\iint_S (\\nabla\\times\\mathbf{F})\\cdot d\\mathbf{S}$$') +
        '</div></div>' +
        box('idea', 'Orientación: regla de la mano derecha', 'Si el pulgar apunta en la dirección de la normal $\\mathbf{n}$, los demás dedos indican el sentido en que se recorre $C$. Con normal hacia arriba, $C$ se recorre en sentido antihorario visto desde arriba.') +
        box('idea', 'Consecuencias importantes', '<ul><li><b>Green es un caso particular:</b> si $S$ es una región plana en el plano $xy$ con $\\mathbf{n} = \\mathbf{k}$, entonces $(\\nabla\\times\\mathbf{F})\\cdot\\mathbf{k} = Q_x - P_y$.</li><li><b>Independencia de la superficie:</b> todas las superficies con la misma frontera dan el mismo flujo del rotacional. Puedes elegir la más sencilla (casi siempre, un disco plano).</li><li>Si $\\nabla\\times\\mathbf{F} = \\mathbf{0}$ en todo el espacio, la circulación por cualquier curva cerrada es cero.</li></ul>') +
        box('example', 'Ejemplo resuelto', '$\\mathbf{F} = \\langle -y,\\; x,\\; z\\rangle$ y $S$ el paraboloide $z = 4 - x^2 - y^2$, $z \\ge 0$. La frontera es la circunferencia $x^2 + y^2 = 4$ en $z = 0$. Como $\\nabla\\times\\mathbf{F} = \\langle 0,0,2\\rangle$, basta tomar el disco plano:$$\\iint_S (\\nabla\\times\\mathbf{F})\\cdot d\\mathbf{S} = \\iint_{\\text{disco}} 2\\,dA = 2\\cdot\\pi(2)^2 = 8\\pi$$En el simulador puedes deformar la superficie y verás que el flujo no cambia.') +
        C('La <b>ley de Faraday</b>, que explica la señal de la resonancia magnética, se obtiene de $\\nabla\\times\\mathbf{E} = -\\partial\\mathbf{B}/\\partial t$ con Stokes: el voltaje inducido en la bobina es menos la variación del flujo magnético que la atraviesa.',
          'En simulaciones de humo y agua, la <b>vorticidad</b> $\\nabla\\times\\mathbf{v}$ y su circulación controlan los remolinos (técnica de <i>vorticity confinement</i>). Stokes conecta ambas.')
    },
    {
      id: 't9', title: 'Teorema de Gauss (divergencia)', icon: 'spark', sim: ['gss', bio ? 'Nutrientes alrededor de una célula' : 'Emisor de partículas (VFX)'],
      html:
        '<p class="lead">Gauss compara lo que <b>sale</b> por una superficie cerrada con lo que se <b>produce</b> dentro del sólido.</p>' +
        '<div class="split">' + SVG.gauss + '<div>' +
        box('formula', 'Enunciado', 'Sea $E$ un sólido cuya frontera $\\partial E$ es una superficie cerrada, suave por tramos, con normal <b>exterior</b> $\\mathbf{n}$. Si $\\mathbf{F}$ tiene derivadas parciales continuas:$$\\oiint_{\\partial E} \\mathbf{F}\\cdot\\mathbf{n}\\;dS = \\iiint_E \\nabla\\cdot\\mathbf{F}\\;dV$$') +
        '</div></div>' +
        box('idea', 'Interpretación', 'El flujo neto hacia afuera es la suma de todas las fuentes ($\\nabla\\cdot\\mathbf{F}>0$) menos los sumideros ($\\nabla\\cdot\\mathbf{F}<0$) que hay dentro. Si la divergencia es cero en todo $E$, lo que entra es igual a lo que sale.') +
        box('example', 'Ejemplo resuelto', '$\\mathbf{F} = \\langle x,\\; y,\\; z\\rangle$ y $E$ la esfera de radio $a$: $\\nabla\\cdot\\mathbf{F} = 3$, así que $$\\oiint_{\\partial E}\\mathbf{F}\\cdot\\mathbf{n}\\,dS = 3\\cdot\\tfrac43\\pi a^3 = 4\\pi a^3$$Comprobación directa: sobre la esfera $\\mathbf{n} = \\tfrac{1}{a}\\langle x,y,z\\rangle$, luego $\\mathbf{F}\\cdot\\mathbf{n} = a$ y el flujo es $a\\cdot 4\\pi a^2 = 4\\pi a^3$.') +
        box('warn', 'Errores frecuentes', '<ul><li>Usar la normal interior: cambia el signo.</li><li>Aplicarlo a una superficie <b>abierta</b>. Si la superficie no es cerrada, ciérrala (por ejemplo, con un disco) y resta el flujo de la tapa añadida.</li><li>Multiplicar la divergencia por el <b>área</b> en lugar del <b>volumen</b>.</li></ul>') +
        C('<b>Conservación de masa y carga:</b> el flujo neto de oxígeno a través de la membrana de una célula o de corriente a través de una superficie que rodea tejido se calcula con la divergencia. Si no hay fuentes, el flujo neto es cero.',
          'En fluidos incompresibles se impone $\\nabla\\cdot\\mathbf{u} = 0$ (paso de <i>proyección</i>); los <b>emisores de partículas</b> son fuentes con divergencia positiva y Gauss mide cuánto "sale" por cualquier volumen que los rodee.')
    },
    {
      id: 't10', title: 'Síntesis: una sola idea', icon: 'award', sim: null,
      html:
        '<p class="lead">Los tres teoremas generalizan el <b>Teorema Fundamental del Cálculo</b>: integrar una "derivada" dentro de una región equivale a medir algo solo en su frontera.</p>' +
        '<div class="tsyn">' +
        '<div class="syn"><div class="syn-t">Teorema Fundamental</div>' + '$$\\int_a^b F\'(x)\\,dx = F(b) - F(a)$$' + '<div class="syn-d">Intervalo → sus dos extremos</div></div>' +
        '<div class="syn"><div class="syn-t">Green</div>' + '$$\\iint_D (Q_x - P_y)\\,dA = \\oint_C \\mathbf{F}\\cdot d\\mathbf{r}$$' + '<div class="syn-d">Región plana → curva frontera</div></div>' +
        '<div class="syn"><div class="syn-t">Stokes</div>' + '$$\\iint_S (\\nabla\\times\\mathbf{F})\\cdot d\\mathbf{S} = \\oint_C \\mathbf{F}\\cdot d\\mathbf{r}$$' + '<div class="syn-d">Superficie → curva frontera</div></div>' +
        '<div class="syn"><div class="syn-t">Gauss</div>' + '$$\\iiint_E \\nabla\\cdot\\mathbf{F}\\,dV = \\oiint_{\\partial E} \\mathbf{F}\\cdot d\\mathbf{S}$$' + '<div class="syn-d">Sólido → superficie frontera</div></div>' +
        '</div>' +
        box('recipe', '¿Qué herramienta uso?', '<ul><li>¿Te piden una <b>integral de línea sobre una curva cerrada plana</b>? Prueba <b>Green</b>, sobre todo si $Q_x - P_y$ es sencillo.</li><li>¿Una <b>circulación en el espacio</b> o el <b>flujo de un rotacional</b>? Usa <b>Stokes</b> y elige la superficie más simple con la misma frontera.</li><li>¿El <b>flujo a través de una superficie cerrada</b>? Usa <b>Gauss</b> si la divergencia es sencilla.</li><li>¿La región es circular, cilíndrica o esférica? Cambia de coordenadas y <b>no olvides el jacobiano</b>.</li></ul>') +
        box('idea', 'Antes de la evaluación', 'Practica en la pestaña <b>Práctica</b>, resuelve los casos de <b>Aplicados</b> y verifica tus modelos en el <b>Simulador</b>. La evaluación exige el 80 % de aciertos.')
    }
  ];
}

<script>
/* ==========================================================================
   PRÁCTICA (académica, generada) y CASOS APLICADOS (por carrera)
   Cada ejercicio se expresa con los mismos datos del simulador; la respuesta
   y el procedimiento los calcula el motor matemático.
   ========================================================================== */
(function (root) {
'use strict';
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, a) => a[Math.floor(r() * a.length)];
const co = k => (k === 1 ? '' : String(k));

const TOPICS = [
  { id: 'dbl', name: 'Integral doble', ic: 'layers' },
  { id: 'tri', name: 'Integral triple', ic: 'cube' },
  { id: 'grn', name: 'Green', ic: 'route' },
  { id: 'stk', name: 'Stokes', ic: 'orbit' },
  { id: 'gss', name: 'Gauss', ic: 'spark' }
];

/* ---------------- Generadores de práctica ---------------- */
const GEN = {
  dbl: [
    r => {
      const a = ri(r, 1, 3), b = ri(r, 1, 4), p = ri(r, 1, 3), q = ri(r, 1, 3);
      return { title: 'Rectángulo', stem: 'Calcula $\\displaystyle\\iint_R (' + co(a) + 'x^2 + ' + co(b) + 'y)\\,dA$ sobre $R = [0,' + p + ']\\times[0,' + q + ']$.', mode: 'dbl', vals: { f: a + 'x^2 + ' + b + 'y', region: 'rect', a: '0', b: '' + p, c: '0', d: '' + q, px: '' + p / 2, py: '' + q / 2 }, hint: 'Integra primero respecto a $y$ (con $x$ constante) y luego respecto a $x$.' };
    },
    r => {
      const m = ri(r, 1, 2), c = ri(r, 1, 4), f = pick(r, ['xy', 'x', 'x + y']);
      return { title: 'Región de tipo I', stem: 'Calcula $\\displaystyle\\iint_D ' + co(c) + (f === 'x + y' ? '(x + y)' : f) + '\\,dA$, donde $D$ es la región entre $y = x^2$ y $y = ' + co(m) + 'x$.', mode: 'dbl', vals: { f: c + '(' + f + ')', region: 'typeI', a: '0', b: '' + m, g1: 'x^2', g2: m + 'x', px: '' + m / 2, py: '' + (m * m / 3) }, hint: 'Halla los cortes de $y = x^2$ con $y = ' + co(m) + 'x$; para cada $x$, $y$ va de $x^2$ a $' + co(m) + 'x$.' };
    },
    r => {
      const R = ri(r, 1, 3), v = ri(r, 0, 2);
      if (v === 0) { const k = ri(r, 1, 3); return { title: 'Disco en polares', stem: 'Calcula $\\displaystyle\\iint_D ' + co(k) + '(x^2 + y^2)\\,dA$ sobre el disco $x^2 + y^2 \\le ' + R * R + '$.', mode: 'dbl', vals: { f: k + '(x^2 + y^2)', region: 'polar', r1: '0', r2: '' + R, th: '4', px: '' + R / 2, py: '0' }, hint: 'En polares $x^2 + y^2 = r^2$ y $dA = r\\,dr\\,d\\theta$.' }; }
      if (v === 1) return { title: 'Volumen bajo un paraboloide', stem: 'Halla el volumen bajo $z = ' + R * R + ' - x^2 - y^2$ y sobre el plano $xy$.', mode: 'dbl', vals: { f: R * R + ' - x^2 - y^2', region: 'polar', r1: '0', r2: '' + R, th: '4', px: '' + R / 2, py: '0' }, hint: 'El paraboloide corta el plano $xy$ en la circunferencia $r = ' + R + '$.' };
      return { title: 'Medio anillo', stem: 'Calcula $\\displaystyle\\iint_D y^2\\,dA$ donde $D$ es la mitad superior del anillo $1 \\le x^2 + y^2 \\le ' + (R + 1) * (R + 1) + '$.', mode: 'dbl', vals: { f: 'y^2', region: 'polar', r1: '1', r2: '' + (R + 1), th: '2', px: '0', py: '' + (R + 2) / 2 }, hint: 'Usa $1 \\le r \\le ' + (R + 1) + '$, $0 \\le \\theta \\le \\pi$ y $y^2 = r^2\\sen^2\\theta$.' };
    }
  ],
  tri: [
    r => {
      const a = ri(r, 1, 3), b = ri(r, 1, 3), X = ri(r, 1, 2), Y = ri(r, 1, 3), Z = ri(r, 1, 3);
      return { title: 'Caja', stem: 'Calcula $\\displaystyle\\iiint_B (' + co(a) + 'x + ' + co(b) + 'yz)\\,dV$ con $B = [0,' + X + ']\\times[0,' + Y + ']\\times[0,' + Z + ']$.', mode: 'tri', vals: { f: a + 'x + ' + b + 'y z', region: 'box', x0: '0', x1: '' + X, y0: '0', y1: '' + Y, z0: '0', z1: '' + Z, px: '' + X / 2, py: '' + Y / 2, pz: '' + Z / 2 }, hint: 'Integra en el orden $dz\\,dy\\,dx$.' };
    },
    r => {
      const R = ri(r, 1, 2), H = ri(r, 1, 3), f = pick(r, ['z', 'x^2 + y^2', '1']);
      return { title: 'Cilindro', stem: 'Sea $E$ el cilindro $x^2 + y^2 \\le ' + R * R + '$, $0 \\le z \\le ' + H + '$. Calcula $\\displaystyle\\iiint_E ' + (f === '1' ? '1' : '(' + f + ')') + '\\,dV$.', mode: 'tri', vals: { f, region: 'cyl', R: '' + R, H: '' + H, px: '' + R / 2, py: '0', pz: '' + H / 2 }, hint: 'En cilíndricas $dV = r\\,dz\\,dr\\,d\\theta$.' };
    },
    r => {
      const R = ri(r, 1, 3), v = ri(r, 0, 2);
      if (v === 0) return { title: 'Volumen de una esfera', stem: 'Usa coordenadas esféricas para calcular el volumen de la esfera de radio $' + R + '$.', mode: 'tri', vals: { f: '1', region: 'sph', R: '' + R, px: '0', py: '0', pz: '0' }, hint: '$dV = \\rho^2\\sen\\varphi\\,d\\rho\\,d\\varphi\\,d\\theta$, con $0\\le\\varphi\\le\\pi$.' };
      if (v === 1) return { title: 'Esfera con densidad', stem: 'Calcula $\\displaystyle\\iiint_E (x^2 + y^2 + z^2)\\,dV$ sobre la esfera de radio $' + R + '$.', mode: 'tri', vals: { f: 'x^2 + y^2 + z^2', region: 'sph', R: '' + R, px: '0', py: '0', pz: '0' }, hint: 'En esféricas $x^2 + y^2 + z^2 = \\rho^2$.' };
      return { title: 'Semiesfera', stem: 'Calcula $\\displaystyle\\iiint_E z\\,dV$ sobre la semiesfera superior de radio $' + R + '$.', mode: 'tri', vals: { f: 'z', region: 'hemi', R: '' + R, px: '0', py: '0', pz: '' + R / 2 }, hint: 'En la semiesfera superior $0\\le\\varphi\\le\\frac{\\pi}{2}$ y $z = \\rho\\cos\\varphi$.' };
    }
  ],
  grn: [
    r => {
      const a = ri(r, 1, 3), b = ri(r, 1, 3), k = ri(r, 1, 3);
      return { title: 'Rectángulo', stem: 'Usa Green para calcular $\\displaystyle\\oint_C xy\\,dx + (x^2 + ' + co(k) + 'x)\\,dy$, donde $C$ es la frontera de $[0,' + a + ']\\times[0,' + b + ']$ en sentido antihorario.', mode: 'grn', vals: { P: 'x y', Q: 'x^2 + ' + k + 'x', region: 'rect', a: '0', b: '' + a, c: '0', d: '' + b, px: '' + a / 2, py: '' + b / 2 }, hint: 'Calcula $Q_x - P_y$ y luego la integral doble sobre el rectángulo.' };
    },
    r => {
      const a = ri(r, 1, 4), b = ri(r, 1, 3), k = ri(r, 1, 3);
      return { title: 'Elipse', stem: 'Calcula la circulación de $\\mathbf{F} = \\langle -' + co(k) + 'y,\\; ' + co(k) + 'x\\rangle$ alrededor de la elipse $\\frac{x^2}{' + a * a + '} + \\frac{y^2}{' + b * b + '} = 1$ (antihoraria).', mode: 'grn', vals: { P: '-' + k + 'y', Q: k + 'x', region: 'ell', h: '0', kk: '0', ea: '' + a, eb: '' + b, px: '0', py: '0' }, hint: '$Q_x - P_y$ es constante; el área de la elipse es $\\pi ab$.' };
    },
    r => {
      const a = ri(r, 1, 3), b = ri(r, 1, 3);
      return { title: 'Triángulo', stem: 'Sea $C$ el triángulo de vértices $(0,0)$, $(' + a + ',0)$ y $(0,' + b + ')$, antihorario. Calcula $\\displaystyle\\oint_C y^2\\,dx + xy\\,dy$.', mode: 'grn', vals: { P: 'y^2', Q: 'x y', region: 'tri', ta: '' + a, tb: '' + b, px: '' + a / 4, py: '' + b / 4 }, hint: 'Es una región de tipo I: $0\\le x\\le ' + a + '$, $0 \\le y \\le ' + b + '(1 - x/' + a + ')$.' };
    }
  ],
  stk: [

// Evalúa un ejercicio con el motor (devuelve salida, valor numérico y exacto)
function solve(ex) {
  const spec = root.Sim.specFrom(ex.mode, ex.vals);
  const out = root.MV.calc[root.Sim.CALC[ex.mode]](spec);
  let value, exact;
  if (ex.mode === 'dbl' || ex.mode === 'tri') { value = out.value; exact = out.exact; }
  else if (ex.mode === 'grn') { value = out.lineNumeric; exact = out.lineExact || out.dblExact; }
  else if (ex.mode === 'stk') { value = out.lineNumeric; exact = out.lineExact || out.fluxExact; }
  else { value = out.fluxNumeric; exact = out.fluxExact || out.divExact; }
  return { out, value, exact };
}
root.Practice = { TOPICS, GEN, APPLIED, solve };

/* ---------------- Animación de portada ---------------- */
const Hero = (() => {
  let v = null, on = false, t0 = 0;
  function attach(cv) { v = new MV.View3D(cv, { autoRotate: true, yaw: -0.6, pitch: 0.62, zoom: 1.25, top: 0 }); v.setBounds([-3, 3, -3, 3, -1.3, 1.3], 0.55); }
  function frame(t) {
    if (!on) return; requestAnimationFrame(frame);
    if (!v || !v.cv.isConnected) return;
    const ph = t / 1400;
    v.yaw += 0.0025; v.begin();
    const N = 30, g = [];
    for (let i = 0; i <= N; i++) { g.push([]); for (let j = 0; j <= N; j++) { const x = -3 + 6 * i / N, y = -3 + 6 * j / N, r = Math.hypot(x, y); g[i].push([x, y, Math.cos(r * 1.6 - ph * 2) * Math.exp(-r * r / 9) * 1.1]); } }
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { const a = g[i][j], b = g[i + 1][j], c = g[i + 1][j + 1], d = g[i][j + 1]; v.face([a, b, c, d], MV.colors.turbo(((a[2] + c[2]) / 2 + 1.1) / 2.2), 0.95, { stroke: 'rgba(255,255,255,0.08)' }); }
    for (let k = 0; k < 64; k++) { const a = 2 * Math.PI * k / 64; v.line([3.2 * Math.cos(a), 3.2 * Math.sin(a), -1.25], [3.2 * Math.cos(a + 0.1), 3.2 * Math.sin(a + 0.1), -1.25], 'rgba(255,255,255,0.65)', 2, { glow: 8 }); }
    for (let k = 0; k < 8; k++) { const a = 2 * Math.PI * k / 8 + ph * 0.4; v.arrow([3.2 * Math.cos(a), 3.2 * Math.sin(a), -1.25], [-Math.sin(a) * 0.9, Math.cos(a) * 0.9, 0], '#fff', 2.2, { head: 9 }); }
    v.draw();
  }
  function setVisible(x) { if (x && !on) { on = true; requestAnimationFrame(frame); } else if (!x) on = false; }
  return { attach, setVisible };
})();

function optHtml(o) { return o ? (o.t ? tex(o.t, false) : rich(o.h)) : '—'; }

/* ---------------- Certificado ---------------- */
function verCode(name, career, score, att) {
  let hsh = 2166136261 >>> 0; const s = name + '|' + career + '|' + score + '|' + att + '|integracion-multiple';
  for (let i = 0; i < s.length; i++) { hsh ^= s.charCodeAt(i); hsh = Math.imul(hsh, 16777619) >>> 0; }
  return ('00000000' + hsh.toString(16).toUpperCase()).slice(-8);
}
function renderCertView(pane) {
  const img = h('img', { class: 'cert-img', alt: 'Certificado de aprobación' });
  const url = drawCertificate();
  img.src = url;
  // Redibuja cuando las fuentes embebidas estén cargadas (el canvas no espera a las fuentes)
  if (document.fonts && document.fonts.load) {
    Promise.all(['500 38px Sarabun', '600 36px Sarabun', '700 30px Sarabun', '800 96px Sarabun', '64px "STIX Two Math"'].map(f => document.fonts.load(f, 'Aá∯'))).then(() => {
      const u2 = drawCertificate(); img.src = u2; const a = pane.querySelector('.cert-actions a'); if (a) a.href = u2;
    }).catch(() => {});
  }
  const fname = 'certificado-integracion-multiple-' + (st.name || 'estudiante').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.png';
  pane.appendChild(h('div', { class: 'card certw' }, [
    h('div', { class: 'cert-head' }, [h('h2', { html: icon('award') + '¡Felicitaciones, <span class="grad">' + esc(st.name || 'estudiante') + '</span>!' }), h('p', { class: 'muted', text: 'Aprobaste con ' + st.ev.score + ' de 10. Descarga tu certificado.' })]),
    img,
    h('div', { class: 'cert-actions' }, [
      h('a', { class: 'btn btn-glow big', href: url, download: fname, html: icon('download') + 'Descargar certificado (PNG)' }),
      h('button', { class: 'btn ghost', html: icon('cube') + 'Seguir explorando el simulador', onclick: () => showTab('simulador') })
    ])
  ]));
}
function drawCertificate() {
  const W = 2000, H = 1414, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), cs = getComputedStyle(document.documentElement);
  const a1 = cs.getPropertyValue('--acc1').trim() || '#22d3ee', a2 = cs.getPropertyValue('--acc2').trim() || '#f472b6', a3 = cs.getPropertyValue('--acc3').trim() || '#a3e635';
  const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#0b1024'); bg.addColorStop(1, '#141b3a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = (x, y, r, c) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  glow(220, 180, 700, hexA(a1, 0.28)); glow(W - 200, H - 160, 760, hexA(a2, 0.26));
  // malla decorativa (superficie)
  ctx.save(); ctx.globalAlpha = 0.16; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 26; i++) { ctx.beginPath(); for (let j = 0; j <= 80; j++) { const x = 980 + j * 13, y = 1180 - i * 20 + Math.sin(j / 7 + i / 3) * 22; j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
  ctx.restore();
  // marco
  const fr = ctx.createLinearGradient(0, 0, W, 0); fr.addColorStop(0, a1); fr.addColorStop(0.5, a3); fr.addColorStop(1, a2);
  ctx.strokeStyle = fr; ctx.lineWidth = 10; roundRect(ctx, 50, 50, W - 100, H - 100, 46); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 2; roundRect(ctx, 80, 80, W - 160, H - 160, 34); ctx.stroke();
  const F = (w, s) => w + ' ' + s + 'px Sarabun, "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(226,232,240,0.85)'; ctx.font = F(700, 30); ctx.fillText('CÁLCULO MULTIVARIADO', W / 2, 205);
  const tg = ctx.createLinearGradient(W / 2 - 520, 0, W / 2 + 520, 0); tg.addColorStop(0, a1); tg.addColorStop(1, a2);
  ctx.fillStyle = tg; ctx.font = F(800, 96); ctx.fillText('Certificado de aprobación', W / 2, 330);
  ctx.fillStyle = 'rgba(226,232,240,0.9)'; ctx.font = F(500, 38); ctx.fillText('Se certifica que', W / 2, 440);
  const name = (st.name || 'Estudiante').trim();
  let fs = 104; ctx.font = F(800, fs); while (ctx.measureText(name).width > W - 520 && fs > 48) { fs -= 4; ctx.font = F(800, fs); }
  ctx.fillStyle = '#ffffff'; ctx.shadowColor = hexA(a1, 0.7); ctx.shadowBlur = 30; ctx.fillText(name, W / 2, 575); ctx.shadowBlur = 0;
  ctx.strokeStyle = tg; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(W / 2 - 520, 615); ctx.lineTo(W / 2 + 520, 615); ctx.stroke();
  ctx.fillStyle = 'rgba(226,232,240,0.92)'; ctx.font = F(500, 38); ctx.fillText('aprobó la evaluación del tema', W / 2, 700);
  ctx.fillStyle = '#ffffff'; ctx.font = F(800, 52); ctx.fillText('Integración doble y triple · Teoremas de Green, Stokes y Gauss', W / 2, 785);
  ctx.fillStyle = 'rgba(226,232,240,0.9)'; ctx.font = F(600, 36);
  ctx.fillText('Ruta ' + CAREERS[st.career].name + '  ·  Puntaje: ' + st.ev.score + ' / 10 (' + st.ev.score * 10 + ' %)  ·  Mínimo aprobatorio: 80 %', W / 2, 862);
  // insignia
  const bx = 330, by = 1085, br = 150;
  const bgr = ctx.createLinearGradient(bx - br, by - br, bx + br, by + br); bgr.addColorStop(0, a1); bgr.addColorStop(1, a2);
  ctx.beginPath(); ctx.arc(bx, by, br, 0, 2 * Math.PI); ctx.fillStyle = bgr; ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by, br - 16, 0, 2 * Math.PI); ctx.fillStyle = '#0b1024'; ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by, br - 62, 0, 2 * Math.PI); ctx.strokeStyle = bgr; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  arcText(ctx, 'CÁLCULO MULTIVARIADO', bx, by, br - 40, -Math.PI / 2, true, F(800, 22), 1.5);
  arcText(ctx, 'APROBADO', bx, by, br - 40, Math.PI / 2, false, F(800, 24), 3);
  ctx.font = '72px "STIX Two Math", "Cambria Math", serif'; ctx.fillStyle = tg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('∯', bx, by + 4);
  ctx.textBaseline = 'alphabetic';
  // firma de autoría
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W / 2 - 300, 1110); ctx.lineTo(W / 2 + 300, 1110); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.font = F(800, 40); ctx.fillText('Ing. Astrid Bolívar', W / 2, 1165);
  ctx.fillStyle = 'rgba(226,232,240,0.85)'; ctx.font = F(500, 30); ctx.fillText('Clase interactiva creada por Ing. Astrid Bolívar', W / 2, 1212);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(226,232,240,0.8)'; ctx.font = F(600, 28);
  ctx.fillText('Código de verificación', W - 200, 1120);
  ctx.fillStyle = '#ffffff'; ctx.font = F(800, 40); ctx.fillText(st.ev.code || verCode(st.name, st.career, st.ev.score, st.ev.attempts), W - 200, 1170);
  return cv.toDataURL('image/png');
}
function roundRect(c, x, y, w, hh, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + hh, r); c.arcTo(x + w, y + hh, x, y + hh, r); c.arcTo(x, y + hh, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function hexA(hx, a) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hx).trim()); return m ? 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + a + ')' : 'rgba(255,255,255,' + a + ')'; }
// Texto en arco: ángulo central + apertura; en el arco inferior se invierte el sentido para que se lea de izquierda a derecha
function arcText(ctx, text, cx, cy, r, center, top, font, spacing) {
  ctx.save(); ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const chars = Array.from(text), ws = chars.map(c => ctx.measureText(c).width + (spacing || 0));
  const total = ws.reduce((a, b) => a + b, 0), span = total / r;
  let acc = 0;
  chars.forEach((ch, i) => {
    const mid = (acc + ws[i] / 2) / r; acc += ws[i];
    const ang = top ? center - span / 2 + mid : center + span / 2 - mid;
    ctx.save(); ctx.translate(cx + r * Math.cos(ang), cy + r * Math.sin(ang));
    ctx.rotate(top ? ang + Math.PI / 2 : ang - Math.PI / 2);
    ctx.fillText(ch, 0, 0); ctx.restore();
  });
  ctx.restore();
}

})(typeof window !== 'undefined' ? window : globalThis);
